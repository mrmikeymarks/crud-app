# Builds the image and smoke-tests the full stack on every push to main and every PR.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        # The pgdata volume binds to a host directory (PGDATA_DIR). The default in
        # .env.example is a path on the dev machine, so point it at a runner-local
        # directory instead and make sure it exists before `compose up`.
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/pgdata"
          sed -i "s#^PGDATA_DIR=.*#PGDATA_DIR=$RUNNER_TEMP/pgdata#" .env
          grep PGDATA_DIR .env

      - name: Build image and start stack
        run: docker compose -f compose.yaml up -d --build --wait

      - name: Smoke test CRUD endpoints
        run: |
          set -eux
          curl -fsS localhost:3000/health
          curl -fsS localhost:3000/items
          id=$(curl -fsS -X POST localhost:3000/items \
                -H 'content-type: application/json' \
                -d '{"name":"ci item"}' | jq -r .id)
          curl -fsS localhost:3000/items/$id
          curl -fsS -X PUT localhost:3000/items/$id \
                -H 'content-type: application/json' \
                -d '{"description":"updated"}'
          curl -fsS -X DELETE localhost:3000/items/$id
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/items/$id)" = "404"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v
