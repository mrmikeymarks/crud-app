# Compose automatically merges this file on top of compose.yaml when you run
# plain `docker compose up`. It is for LOCAL DEVELOPMENT only. In production
# run `docker compose -f compose.yaml up -d` to ignore it.
services:
  api:
    # Bind-mount source so edits on the host are seen inside the container...
    volumes:
      - ./src:/app/src:ro
    # ...and use node's --watch flag to restart on change.
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      # GUI_BIND_ADDR comes from .env (LAN IP, VPN IP, or 127.0.0.1 for local-only).
      - "${GUI_BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
  
  

  # NocoDB: Airtable-style spreadsheet UI over the Postgres data.
  # First run: open http://<GUI_BIND_ADDR>:8081, create the admin account, then
  # "New base" -> "Connect external data" -> PostgreSQL with
  #   host: db  port: 5432  user/password/database: values from .env
  nocodb:
    image: nocodb/nocodb:latest        # pin to a specific tag once you settle on a version
    restart: unless-stopped
    ports:
      - "${GUI_BIND_ADDR:-127.0.0.1}:8081:8080"   # 8081 on the host because Adminer already uses 8080
    environment:
      NC_DISABLE_TELE: "true"          # opt out of usage telemetry
      NC_PUBLIC_URL: http://${GUI_BIND_ADDR:-127.0.0.1}:8081   # NocoDB builds links/redirects from this
    volumes:
      # NocoDB keeps its own metadata (users, bases, views) in a SQLite file here.
      # Kept separate from the app database so it never pollutes the `app` schema.
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  nocodb_data:
