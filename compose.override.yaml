# Dev-only additions, merged automatically by `docker compose up`.
# Skip with `docker compose -f compose.yaml up`. Explained in README.md ("Development override").
services:
  api:
    volumes:
      - ./src:/app/src:ro
      - ./db/migrations:/app/db/migrations:ro
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${GUI_BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${GUI_BIND_ADDR:-127.0.0.1}:8081:8080"
    environment:
      NC_DISABLE_TELE: "true"
      NC_PUBLIC_URL: http://${GUI_BIND_ADDR:-127.0.0.1}:8081
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Optional authenticated gateway (Caddy). Disabled for now.
  # To enable, follow README.md ("Optional: Caddy gateway").
  # devproxy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "${GUI_BIND_ADDR:-127.0.0.1}:8080:8080"
  #     - "${GUI_BIND_ADDR:-127.0.0.1}:8081:8081"
  #   environment:
  #     GUI_AUTH_USER: ${GUI_AUTH_USER:-admin}
  #     GUI_AUTH_HASH: ${GUI_AUTH_HASH}
  #   volumes:
  #     - ./devproxy/Caddyfile:/etc/caddy/Caddyfile:ro
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
  #     interval: 10s
  #     timeout: 3s
  #     start_period: 5s
  #     retries: 3
  #   depends_on:
  #     - adminer
  #     - nocodb
  #   networks:
  #     - tools

